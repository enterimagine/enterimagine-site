<link rel="stylesheet" href="lib/fonts.css"><meta name="robots" content="noindex, nofollow">
<style>
body{margin:0;background:radial-gradient(900px 500px at 90% -10%,#123a6a 0%,rgba(8,18,38,0) 60%),#081226;color:#f2f6ff;font-family:Nunito,system-ui,sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:'Baloo 2',sans-serif;font-size:clamp(30px,6vw,44px);letter-spacing:.1em;margin:0;line-height:1}h1 span{color:#ffd84c}
.langs{display:flex;gap:6px}.langs button{font:800 14px Nunito,sans-serif;border:2px solid rgba(255,255,255,.25);background:transparent;color:#f2f6ff;border-radius:999px;min-width:48px;min-height:44px;cursor:pointer}
.langs button[aria-pressed="true"]{background:#7fe7ff;border-color:#7fe7ff;color:#04202a}
.hello{font-size:19px;color:#c9d6f2;margin:14px 0 18px}
h2{font-family:'Baloo 2',sans-serif;font-size:22px;margin:28px 0 12px;color:#ffd84c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;border-radius:26px;overflow:hidden;text-decoration:none;color:#f2f6ff;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12);padding:0 0 18px;transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none}
.pic{display:block;height:140px;background-size:cover;background-position:center}.pic.plain{background:linear-gradient(135deg,var(--d),rgba(255,255,255,.04));display:flex;align-items:center;justify-content:flex-end;padding-right:22px;color:var(--c)}.pic.plain svg{opacity:.28}
.ic{position:absolute;top:104px;left:18px;width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--c);color:var(--d);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tile .tt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:25px;margin:34px 18px 0;line-height:1.15}.tile .ts{font-size:15px;color:#c9d6f2;margin:0 18px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mini{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#f2f6ff;text-decoration:none;min-height:56px}
.mini:hover,.mini:focus-visible{border-color:#ffd84c;outline:none}.mic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,216,76,.15);color:#ffd84c}
.mini .tt{display:block;font-weight:800}.mini .ts{display:block;font-size:13px;color:#9fb4e0}
.test{margin-top:28px;font-size:13px;color:#9fb4e0}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
</style></head>
