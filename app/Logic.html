<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAGINE Kids: logic games</title>

<style>
body{margin:0;background:#081226}
.k-btn{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:13px 24px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.k-btn:focus-visible,.k-tab:focus-visible,.k-opt:focus-visible,.k-lang:focus-visible,.k-lvl:focus-visible{outline:3px solid #ffd84c;outline-offset:3px}
.k-primary{background:#ffd84c;color:#1a1300;box-shadow:0 6px 0 #c9a320}
.k-primary:disabled{opacity:.5;cursor:default}
.k-ghost{background:rgba(255,255,255,.08);color:#f2f6ff;border:2px solid rgba(255,255,255,.22)}
.k-lang{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.25);background:transparent;color:#f2f6ff;border-radius:999px;min-width:48px;min-height:44px;cursor:pointer}
.k-lang.on{background:#7fe7ff;border-color:#7fe7ff;color:#04202a}
.k-tab{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#f2f6ff;border-radius:18px;min-height:52px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.k-tab.on{background:#b98cff;border-color:#b98cff;color:#1b0b38}
.k-lvl{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;border:2px solid rgba(255,255,255,.2);background:transparent;color:#dfe8ff;border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
.k-lvl.on{background:#ffd84c;border-color:#ffd84c;color:#1a1300}
.k-opt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;min-width:96px;min-height:96px;border-radius:24px;border:3px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#f2f6ff;cursor:pointer;display:grid;place-items:center;padding:8px}
.k-opt.picked{border-color:#7fe7ff;background:rgba(127,231,255,.14)}
.k-opt.right{border-color:#38e1a0;background:rgba(56,225,160,.22)}
.k-opt.wrong{border-color:#ff8a8a;background:rgba(255,138,138,.16)}
.k-cell{min-width:72px;min-height:72px;border-radius:18px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px}
.k-cell.q{border:3px dashed #ffd84c;color:#ffd84c}
.k-pop{animation:pop .3s ease-out both}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.k-pop{animation:none}}
</style>

<style>.local-bar{position:fixed;right:12px;bottom:12px;z-index:50;font:700 14px Nunito,system-ui,sans-serif}body{padding-bottom:72px}.local-bar a{display:inline-block;padding:10px 16px;border-radius:999px;background:#ffd84c;color:#1a1300;text-decoration:none;box-shadow:0 4px 0 #c9a320}</style>
<link rel="stylesheet" href="lib/fonts.css">
<meta name="robots" content="noindex, nofollow">
<script src="lib/morphdom.min.js"></script>
<script src="lib/dc-local.js"></script>
</head>
<body>
<div id="dc-root"></div>
<nav class="local-bar"><a href="index.html">All boards</a> <a href="privacy.html">Privacy</a></nav>
<template id="dc-tpl">

<div style="min-height: 100vh; background: radial-gradient(1000px 500px at 85% -10%, #2a1f6b 0%, rgba(42,31,107,0) 60%), #081226; color: #f2f6ff; font-family: 'Nunito', system-ui, sans-serif;">
  <header style="border-bottom: 1px solid rgba(255,255,255,.08);">
    <div style="max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;">
      <div style="display: flex; flex-direction: column; flex: 1 1 auto;">
        <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .12em; line-height: 1;">IMAGINE <span style="color: #ffd84c;">KIDS</span></span>
        <span style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #9fb4e0;">{{L.title}}</span>
      </div>
      <div role="group" aria-label="Language" style="display: flex; gap: 6px;">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button class="k-lang {{l.cls}}" onClick="{{l.pick}}" aria-pressed="{{l.on}}">{{l.code}}</button>
        </sc-for>
      </div>
    </div>
  </header>

  <main style="max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 20px;">
    <nav aria-label="Games" style="display: flex; flex-wrap: wrap; gap: 10px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button class="k-tab {{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="{{t.ic}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{t.label}}</button>
      </sc-for>
    </nav>

    <sc-if value="{{showLevels}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
        <span style="font-weight: 800; color: #9fb4e0;">{{L.level}}:</span>
        <sc-for list="{{levels}}" as="lv" hint-placeholder-count="3">
          <button class="k-lvl {{lv.cls}}" onClick="{{lv.pick}}" aria-pressed="{{lv.on}}">{{lv.label}}</button>
        </sc-for>
        <span style="margin-left: auto; font-weight: 800; color: #ffd84c;" aria-live="polite">{{starsText}}</span>
      </div>
    </sc-if>

    <sc-if value="{{showGate}}" hint-placeholder-val="{{false}}">
      <section class="k-pop" style="border-radius: 28px; padding: 24px; background: rgba(185,140,255,.12); border: 2px solid rgba(185,140,255,.45); display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
        <svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true" style="flex: none;"><path d="M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5zM12 15v2" fill="none" stroke="#b98cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 8px;">
          <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 34px;">{{L.chTitle}}</h1>
          <p style="margin: 0; font-size: 18px; color: #dfe8ff;">{{L.gateText}}</p>
          <sc-if value="{{gateFailed}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; font-size: 17px; font-weight: 800; color: #ffd84c;">{{gateResult}}</p>
          </sc-if>
        </div>
        <button class="k-btn k-primary" onClick="{{startPretest}}">{{L.startPre}}</button>
      </section>
    </sc-if>

    <sc-if value="{{showQuestion}}" hint-placeholder-val="{{true}}">
      <section class="k-pop" key="{{qKey}}" style="border-radius: 28px; padding: 24px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;">
          <p style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: {{accent}};">{{qLabel}}</p>
          <p style="margin: 0; font-size: 14px; color: #9fb4e0; font-weight: 700;">{{qCounter}}</p>
        </div>
        <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15;">{{qPrompt}}</h1>

        <sc-if value="{{isSeq}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <sc-for list="{{seqCells}}" as="c" hint-placeholder-count="5">
              <div class="k-cell {{c.cls}}">{{c.v}}</div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isPat}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <sc-for list="{{patCells}}" as="c" hint-placeholder-count="6">
              <div class="k-cell {{c.cls}}">
                <sc-if value="{{c.isQ}}" hint-placeholder-val="{{false}}">?</sc-if>
                <sc-if value="{{c.isShape}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="{{c.d}}" fill="{{c.fill}}" stroke="rgba(255,255,255,.6)" stroke-width="1"></path></svg></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isShp}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <sc-for list="{{shpCells}}" as="c" hint-placeholder-count="4">
              <div class="k-cell {{c.cls}}" style="width: 96px; height: 96px;">
                <sc-if value="{{c.isQ}}" hint-placeholder-val="{{false}}">?</sc-if>
                <sc-if value="{{c.isShp}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true"><path d="{{c.gold}}" fill="#ffd84c"></path><path d="{{c.blue}}" fill="#4cc3ff"></path><path d="{{c.grid}}" fill="none" stroke="#dfe8ff" stroke-width="3" stroke-linejoin="round"></path></svg></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isRot}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
            <div style="background: rgba(255,255,255,.07); border-radius: 22px; padding: 10px; border: 2px solid rgba(255,255,255,.12);">
              <svg viewBox="0 0 100 100" width="150" height="150" role="img" aria-label="{{L.startPic}}"><g transform="rotate(0 50 50)"><path d="M32 14v72" stroke="#dfe8ff" stroke-width="6" stroke-linecap="round" fill="none"></path><path d="M32 16h42l-12 13 12 13H32z" fill="#ffd84c"></path><circle cx="32" cy="86" r="7" fill="#38e1a0"></circle></g></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <sc-for list="{{rotSteps}}" as="st" hint-placeholder-count="2">
                <p style="margin: 0; display: flex; gap: 10px; align-items: center; font-size: 20px; font-weight: 800;">
                  <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="{{st.ic}}" fill="none" stroke="#7fe7ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{st.text}}</p>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <div style="display: flex; flex-wrap: wrap; gap: 14px;">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
            <button class="k-opt {{o.cls}}" onClick="{{o.pick}}" disabled="{{checked}}" aria-label="{{o.aria}}">
              <sc-if value="{{o.isText}}" hint-placeholder-val="{{true}}">{{o.text}}</sc-if>
              <sc-if value="{{o.isShape}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="52" height="52" aria-hidden="true"><path d="{{o.d}}" fill="{{o.fill}}" stroke="rgba(255,255,255,.6)" stroke-width="1"></path></svg></sc-if>
              <sc-if value="{{o.isRot}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 100 100" width="96" height="96" aria-hidden="true"><g transform="rotate({{o.deg}} 50 50)"><path d="M32 14v72" stroke="#dfe8ff" stroke-width="6" stroke-linecap="round" fill="none"></path><path d="M32 16h42l-12 13 12 13H32z" fill="#ffd84c"></path><circle cx="32" cy="86" r="7" fill="#38e1a0"></circle></g></svg></sc-if>
              <sc-if value="{{o.isShp}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true"><path d="{{o.gold}}" fill="#ffd84c"></path><path d="{{o.blue}}" fill="#4cc3ff"></path><path d="{{o.grid}}" fill="none" stroke="#dfe8ff" stroke-width="3" stroke-linejoin="round"></path></svg></sc-if>
            </button>
          </sc-for>
        </div>

        <sc-if value="{{checked}}" hint-placeholder-val="{{false}}">
          <p class="k-pop" style="margin: 0; display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.06); border-radius: 18px; padding: 12px 16px; font-size: 18px;">
            <img src="{{feedbackAvatar}}" alt="" style="width: 48px; height: 48px; border-radius: 50%; flex: none;">
            <span><strong style="color: {{verdictColor}};">{{verdict}}</strong> {{why}}</span></p>
        </sc-if>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <button class="k-btn k-primary" onClick="{{action}}" disabled="{{actionDisabled}}">{{actionLabel}}</button>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{showDone}}" hint-placeholder-val="{{false}}">
      <section class="k-pop" style="text-align: center; border-radius: 28px; padding: 32px; background: rgba(255,216,76,.1); border: 2px solid rgba(255,216,76,.5); display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <svg viewBox="0 0 24 24" width="80" height="80" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z" fill="#ffd84c" stroke="#c9a320" stroke-width="1.2" stroke-linejoin="round"></path></svg>
        <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 36px;">{{doneTitle}}</h1>
        <p style="margin: 0; font-size: 18px; color: #dfe8ff; max-width: 620px;">{{doneText}}</p>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
          <button class="k-btn k-ghost" onClick="{{again}}">{{L.again}}</button>
          <sc-if value="{{canNext}}" hint-placeholder-val="{{true}}"><button class="k-btn k-primary" onClick="{{nextLevel}}">{{nextLabel}}</button></sc-if>
        </div>
      </section>
    </sc-if>
  </main>
</div>
</template>
<script src="Logic.logic.js"></script>
</body>
</html>
