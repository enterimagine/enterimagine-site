<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAGINE Kids: parent dashboard</title>

<style>
body{margin:0;background:#f4f6fb}
.p-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;border:2px solid #d5dcec;background:#fff;color:#14213d;border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.p-btn.on{background:#14213d;border-color:#14213d;color:#fff}
.p-btn:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
.p-card{background:#fff;border:1px solid #e1e6f0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.p-h{margin:0;font-family:'Baloo 2',sans-serif;font-size:20px;color:#14213d}
.p-small{margin:0;font-size:14px;color:#55627e}
</style>

<style>.local-bar{position:fixed;right:12px;bottom:12px;z-index:50;font:700 14px Nunito,system-ui,sans-serif}body{padding-bottom:72px}.local-bar a{display:inline-block;padding:10px 16px;border-radius:999px;background:#ffd84c;color:#1a1300;text-decoration:none;box-shadow:0 4px 0 #c9a320}</style>
<link rel="stylesheet" href="lib/fonts.css">
<meta name="robots" content="noindex, nofollow">
<script src="lib/morphdom.min.js"></script>
<script src="lib/dc-local.js"></script>
</head>
<body>
<div id="dc-root"></div>
<nav class="local-bar"><a href="index.html" data-keep-lang data-base="index.html" aria-label="Home"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Home</a> <a href="privacy.html" data-keep-lang data-base="privacy.html">Privacy</a></nav>
<template id="dc-tpl">

<div style="min-height: 100vh; background: #f4f6fb; color: #14213d; font-family: 'Nunito', system-ui, sans-serif;">
  <header style="background: #081226; color: #f2f6ff;">
    <div style="max-width: 1160px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;">
      <div style="display: flex; flex-direction: column; flex: 1 1 auto;">
        <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: .12em; line-height: 1;">IMAGINE <span style="color: #ffd84c;">KIDS</span> <span style="font-family: 'Nunito', sans-serif; font-size: 14px; letter-spacing: .08em; color: #9fb4e0;">· {{L.area}}</span></span>
        <span style="font-size: 13px; color: #9fb4e0;">{{L.sub}}</span>
      </div>
      <div role="group" aria-label="Language" style="display: flex; gap: 6px;">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button class="p-btn {{l.cls}}" onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="min-width: 48px; justify-content: center;">{{l.code}}</button>
        </sc-for>
      </div>
    </div>
  </header>
  <main style="max-width: 1160px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 30px; flex: 1 1 260px;">{{L.title}}</h1>
      <div role="group" aria-label="{{L.child}}" style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
          <button class="p-btn {{k.cls}}" onClick="{{k.pick}}" aria-pressed="{{k.on}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{k.color}}; display: inline-grid; place-items: center; color: #0b1530; font-size: 13px;">{{k.initial}}</span>{{k.name}} · {{k.band}}</button>
        </sc-for>
      </div>
    </div>
    <p class="p-small">{{L.sample}}</p>

    <section class="p-card">
      <h2 class="p-h">{{L.profH}}</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px;">
        <sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="{{k.inputId}}" style="font-size: 14px; font-weight: 800;">{{k.defaultName}} · {{L.nameLabel}}</label>
            <input id="{{k.inputId}}" type="text" maxlength="20" value="{{k.custom}}" placeholder="{{k.defaultName}}" onInput="{{k.onName}}" autocomplete="off" style="font-family: 'Nunito', sans-serif; font-size: 16px; min-height: 44px; padding: 0 12px; border: 2px solid #d5dcec; border-radius: 12px; color: #14213d; background: #fff;">
          </div>
        </sc-for>
      </div>
      <p style="margin: 0; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #7a1d26; background: #fdecee; border-radius: 12px; padding: 10px 12px;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none;"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6zM12 9v4M12 16v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{L.warn}}</p>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <div class="p-card" style="gap: 4px;">
          <p class="p-small" style="font-weight: 700;">{{t.label}}</p>
          <p style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 34px; font-weight: 800; color: #14213d;">{{t.value}}</p>
          <p class="p-small">{{t.note}}</p>
        </div>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px;">
      <div class="p-card">
        <h2 class="p-h">{{L.timeH}}</h2>
        <div role="img" aria-label="{{L.timeH}}" style="display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 10px; border-bottom: 1px solid #d5dcec;">
          <sc-for list="{{weeks}}" as="w" hint-placeholder-count="8">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%;">
              <span style="font-size: 12px; font-weight: 700; color: #55627e;">{{w.min}}</span>
              <div style="width: 100%; max-width: 32px; height: {{w.h}}; background: #2f6fed; border-radius: 6px 6px 0 0;"></div>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 10px;">
          <sc-for list="{{weeks}}" as="w" hint-placeholder-count="8"><span style="flex: 1; text-align: center; font-size: 12px; color: #55627e;">{{w.label}}</span></sc-for>
        </div>
        <p class="p-small">{{L.timeNote}}</p>
      </div>
      <div class="p-card">
        <h2 class="p-h">{{L.worldsH}}</h2>
        <sc-for list="{{worlds}}" as="w" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 15px;"><strong>{{w.name}} <span style="font-weight: 600; color: #55627e;">· {{w.guide}}</span></strong><span style="color: #55627e; font-weight: 700;">{{w.text}}</span></div>
            <div style="height: 12px; border-radius: 999px; background: #e6ebf5; overflow: hidden;"><div style="height: 100%; width: {{w.pct}}; background: {{w.color}}; border-radius: 999px;"></div></div>
          </div>
        </sc-for>
      </div>
    </section>

    <section class="p-card">
      <h2 class="p-h">{{L.doneH}}</h2>
      <div style="overflow-x: auto;">
        <div role="table" style="min-width: 560px; display: flex; flex-direction: column;">
          <div role="row" style="display: grid; grid-template-columns: 160px 1fr 160px; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #e1e6f0; color: #55627e; font-weight: 800; font-size: 14px;"><span role="columnheader">{{L.colWhen}}</span><span role="columnheader">{{L.colWhat}}</span><span role="columnheader">{{L.colResult}}</span></div>
          <sc-for list="{{done}}" as="d" hint-placeholder-count="5">
            <div role="row" style="display: grid; grid-template-columns: 160px 1fr 160px; gap: 10px; padding: 10px; border-bottom: 1px solid #f0f2f7; font-size: 15px;"><span role="cell" style="color: #55627e;">{{d.when}}</span><span role="cell">{{d.what}}</span><span role="cell" style="font-weight: 800; color: {{d.color}};">{{d.result}}</span></div>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
      <sc-for list="{{recs}}" as="r" hint-placeholder-count="3">
        <div class="p-card" style="border-top: 6px solid {{r.color}};">
          <p class="p-small" style="font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: {{r.tagColor}};">{{r.tag}}</p>
          <h2 class="p-h">{{r.title}}</h2>
          <p style="margin: 0; font-size: 15px;">{{r.text}}</p>
          <p class="p-small"><strong>{{L.why}}</strong> {{r.why}}</p>
        </div>
      </sc-for>
    </section>

    <section role="note" style="display: flex; gap: 12px; align-items: flex-start; background: #fff8e0; border: 1px solid #f0d77a; border-radius: 16px; padding: 14px 16px;">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none;"><path d="M12 3l10 18H2zM12 10v5M12 18v.5" fill="none" stroke="#8a6a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <p style="margin: 0; font-size: 15px; color: #4d3c00;">{{L.disclaimer}}</p>
    </section>

    <section class="p-card" style="flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px;">
      <p class="p-small" style="flex: 1 1 320px;">{{L.dataNote}}</p>
      <button class="p-btn">{{L.export}} {{currentId}}</button>
      <button class="p-btn">{{L.remove}} {{currentId}}</button>
    </section>
  </main>
</div>
</template>
<script src="Parents.logic.js"></script>
</body>
</html>
