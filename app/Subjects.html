<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAGINE Kids: school subjects</title>

<style>
body{margin:0;background:#081226}
.k-btn{font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:13px 24px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.k-btn:focus-visible,.k-tab:focus-visible,.k-opt:focus-visible,.k-lang:focus-visible,.k-chip:focus-visible{outline:3px solid #ffd84c;outline-offset:3px}
.k-primary{background:#ffd84c;color:#1a1300;box-shadow:0 6px 0 #c9a320}
.k-primary:disabled{opacity:.5;cursor:default}
.k-ghost{background:rgba(255,255,255,.08);color:#f2f6ff;border:2px solid rgba(255,255,255,.22)}
.k-lang{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.25);background:transparent;color:#f2f6ff;border-radius:999px;min-width:48px;min-height:44px;cursor:pointer}
.k-lang.on{background:#7fe7ff;border-color:#7fe7ff;color:#04202a}
.k-tab{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#f2f6ff;border-radius:18px;min-height:52px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.k-tab.on{background:#38e1a0;border-color:#38e1a0;color:#03261a}
.k-chip{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;border:2px solid rgba(255,255,255,.2);background:transparent;color:#dfe8ff;border-radius:999px;min-height:44px;min-width:48px;padding:0 14px;cursor:pointer}
.k-chip.on{background:#ffd84c;border-color:#ffd84c;color:#1a1300}
.k-opt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;min-height:72px;min-width:96px;border-radius:20px;border:3px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#f2f6ff;cursor:pointer;padding:8px 18px}
.k-opt.picked{border-color:#7fe7ff;background:rgba(127,231,255,.14)}
.k-opt.right{border-color:#38e1a0;background:rgba(56,225,160,.22)}
.k-opt.wrong{border-color:#ff8a8a;background:rgba(255,138,138,.16)}
.k-pop{animation:pop .3s ease-out both}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.k-pop{animation:none}}
</style>

<style>.local-bar{position:fixed;right:12px;bottom:12px;z-index:50;font:700 14px Nunito,system-ui,sans-serif}body{padding-bottom:72px}.local-bar a{display:inline-block;padding:10px 16px;border-radius:999px;background:#ffd84c;color:#1a1300;text-decoration:none;box-shadow:0 4px 0 #c9a320}</style>
<link rel="stylesheet" href="lib/fonts.css">
<meta name="robots" content="noindex, nofollow">
<script src="lib/morphdom.min.js"></script>
<script src="lib/dc-local.js"></script>
</head>
<body>
<div id="dc-root"></div>
<nav class="local-bar"><a href="index.html">All boards</a> <a href="privacy.html">Privacy</a></nav>
<template id="dc-tpl">

<div style="min-height: 100vh; background: radial-gradient(1000px 500px at 85% -10%, #0f4a3a 0%, rgba(8,18,38,0) 60%), #081226; color: #f2f6ff; font-family: 'Nunito', system-ui, sans-serif;">
  <header style="border-bottom: 1px solid rgba(255,255,255,.08);">
    <div style="max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;">
      <div style="display: flex; flex-direction: column; flex: 1 1 auto;">
        <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .12em; line-height: 1;">IMAGINE <span style="color: #ffd84c;">KIDS</span></span>
        <span style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #9fb4e0;">{{T.title}}</span>
      </div>
      <div role="group" aria-label="Language" style="display: flex; gap: 6px;">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button class="k-lang {{l.cls}}" onClick="{{l.pick}}" aria-pressed="{{l.on}}">{{l.code}}</button>
        </sc-for>
      </div>
    </div>
  </header>
  <main style="max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 18px;">
    <p style="margin: 0; font-size: 17px; color: #c9d6f2; max-width: 820px;">{{T.intro}}</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);">
      <span style="font-weight: 800; color: #ffd84c;">{{T.yearLabel}}</span>
      <sc-for list="{{years}}" as="y" hint-placeholder-count="4">
        <button class="k-chip {{y.cls}}" onClick="{{y.pick}}" aria-pressed="{{y.on}}">{{y.label}}</button>
      </sc-for>
      <span style="flex: 1 1 260px; font-size: 14px; color: #9fb4e0;">{{T.yearNote}}</span>
    </div>
    <nav aria-label="Subjects" style="display: flex; flex-wrap: wrap; gap: 10px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button class="k-tab {{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="{{t.ic}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{t.label}}</button>
      </sc-for>
    </nav>

    <sc-if value="{{isTables}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
          <span style="font-weight: 800; color: #9fb4e0;">{{T.tMode}}</span>
          <sc-for list="{{tmodes}}" as="m" hint-placeholder-count="3">
            <button class="k-chip {{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">{{m.label}}</button>
          </sc-for>
        </div>
        <sc-if value="{{showTablePick}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
            <span style="font-weight: 800; color: #9fb4e0;">{{T.pickTable}}</span>
            <sc-for list="{{tables}}" as="tb" hint-placeholder-count="9">
              <button class="k-chip {{tb.cls}}" onClick="{{tb.pick}}" aria-pressed="{{tb.on}}">{{tb.n}}</button>
            </sc-for>
          </div>
        </sc-if>
        <p style="margin: 0; font-size: 14px; color: #9fb4e0;">{{mixedNote}}</p>
      </div>
    </sc-if>
    <sc-if value="{{isSums}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
        <span style="font-weight: 800; color: #9fb4e0;">{{T.level}}</span>
        <sc-for list="{{sumLevels}}" as="lv" hint-placeholder-count="3">
          <button class="k-chip {{lv.cls}}" onClick="{{lv.pick}}" aria-pressed="{{lv.on}}">{{lv.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isSpell}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
          <span style="font-weight: 800; color: #9fb4e0;">{{T.level}}</span>
          <sc-for list="{{spellLevels}}" as="lv" hint-placeholder-count="3">
            <button class="k-chip {{lv.cls}}" onClick="{{lv.pick}}" aria-pressed="{{lv.on}}">{{lv.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
          <span style="font-weight: 800; color: #9fb4e0;">{{T.sModeLabel}}</span>
          <sc-for list="{{smodes}}" as="m" hint-placeholder-count="2">
            <button class="k-chip {{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">{{m.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 18px; background: rgba(255,216,76,.08); border: 1px solid rgba(255,216,76,.35);">
          <span style="font-weight: 800; color: #ffd84c;">{{T.myWords}}:</span>
          <sc-if value="{{noWords}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; color: #c9d6f2;">{{T.noWords}}</span></sc-if>
          <sc-for list="{{myWords}}" as="w" hint-placeholder-count="0"><span style="font-weight: 800; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.1);">{{w.w}}</span></sc-for>
          <sc-if value="{{hasWords}}" hint-placeholder-val="{{false}}"><button class="k-btn k-ghost" onClick="{{practiseWords}}" style="min-height: 44px; padding: 8px 16px; font-size: 15px;">{{T.practiseWords}}</button></sc-if>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isRead}}" hint-placeholder-val="{{false}}">
      <article style="border-radius: 24px; padding: 20px 22px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 10px; max-width: 820px;">
        <h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 26px;">{{T.readTitle}}</h2>
        <sc-for list="{{T.readText}}" as="p" hint-placeholder-count="3"><p style="margin: 0; font-size: 19px; line-height: 1.55;">{{p}}</p></sc-for>
      </article>
    </sc-if>
    <sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;">
        <p style="margin: 0; font-size: 17px; color: #c9d6f2;">{{T.reviewIntro}}</p>
        <p style="margin: 0; font-weight: 800; color: #ffd84c;">{{reviewCount}}</p>
      </div>
    </sc-if>

    <section class="k-pop" key="{{qKey}}" style="border-radius: 28px; padding: 24px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 16px;">
      <sc-if value="{{emptyRound}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 20px; font-weight: 800; color: #38e1a0;">{{T.reviewEmpty}}</p></sc-if>
      <sc-if value="{{running}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;">
            <p style="margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #38e1a0;">{{qLabel}}</p>
            <p style="margin: 0; font-size: 14px; font-weight: 700; color: #9fb4e0;">{{counter}}</p>
          </div>
          <h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.2;">{{prompt}}</h2>
          <sc-if value="{{notDict}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-wrap: wrap; gap: 12px;">
              <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
                <button class="k-opt {{o.cls}}" onClick="{{o.pick}}" disabled="{{checked}}">{{o.text}}</button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{isDict}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 12px; max-width: 640px;">
              <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="k-btn k-ghost" onClick="{{hear}}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{T.listen}}</button>
                <button class="k-btn k-ghost" onClick="{{hearSlow}}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{T.slow}}</button>
              </div>
              <label for="dict-input" style="font-size: 15px; font-weight: 800; color: #9fb4e0;">{{T.typeLabel}}</label>
              <input id="dict-input" type="text" value="{{typed}}" onInput="{{onType}}" onKeyDown="{{onKey}}" disabled="{{checked}}" autofocus="autofocus" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 30px; min-height: 64px; padding: 4px 18px; border-radius: 18px; border: 3px solid rgba(127,231,255,.6); background: rgba(255,255,255,.08); color: #f2f6ff;">
              <sc-if value="{{checked}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 18px; color: #dfe8ff;">{{youTyped}} <strong style="color: #38e1a0;">{{dictAnswer}}</strong></p></sc-if>
              <p style="margin: 0; font-size: 13px; color: #9fb4e0;">{{T.dictNote}}</p>
            </div>
          </sc-if>
          <sc-if value="{{checked}}" hint-placeholder-val="{{false}}"><p class="k-pop" style="margin: 0; font-size: 18px;"><strong style="color: {{vColor}};">{{verdict}}</strong> {{why}}</p></sc-if>
          <sc-if value="{{hasFlash}}" hint-placeholder-val="{{false}}"><p class="k-pop" style="margin: 0; font-size: 15px; font-weight: 800; color: #ffd84c;">{{flash}}</p></sc-if>
          <div><button class="k-btn k-primary" onClick="{{action}}" disabled="{{actionDisabled}}">{{actionLabel}}</button></div>
        </div>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start;">
          <h2 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 32px;">{{result}}</h2>
          <sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 18px; font-weight: 800; color: #ffd84c;">{{levelMsg}}</p></sc-if>
          <p style="margin: 0; font-size: 18px; color: #dfe8ff;">{{T.doneText}}</p>
          <button class="k-btn k-primary" onClick="{{again}}">{{T.again}}</button>
        </div>
      </sc-if>
    </section>
    <p style="margin: 0; font-size: 14px; color: #9fb4e0;">{{T.storeNote}}</p>
    <p style="margin: 0; font-size: 14px; color: #9fb4e0;">{{T.parentNote}}</p>
  </main>
</div>
</template>
<script src="Subjects.logic.js"></script>
</body>
</html>
