# IMAGINE public website: deploy workflow for the PUBLIC publication repository (enterimagine/enterimagine-site).
# Source of truth: imagine-universe-web/publication/deploy.yml (copied into the publication repo as .github/workflows/deploy.yml).
#
# 1. verify  — the files under public/ must match release-manifest.json exactly (paths, sizes, SHA-256); nothing extra.
# 2. deploy  — runs in the `production` environment: GitHub holds it until the owner approves this exact commit.
#              The deployment token is an environment secret, released only after that approval.
# 3. smoke   — downloads every file from the live site and compares it byte-for-byte with the manifest.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Verify public/ against the release manifest
        run: node .github/verify-release.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Re-verify the approved commit before upload
        run: node .github/verify-release.mjs
      - name: Upload the approved files (no build, no API)
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          output_location: ""
          skip_app_build: true
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Live site matches the approved release
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node .github/verify-release.mjs --live "$SITE_URL"
