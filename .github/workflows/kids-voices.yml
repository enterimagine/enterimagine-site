# Generates the IMAGINE Kids episode voices with Azure AI Speech when
# voices/jobs.json changes on the kids-test branch. Uses the production
# environment so the owner approves each run; the Speech key never leaves
# GitHub. The audio is uploaded as a workflow artifact and copied to the
# branch kids-voices-out (folder clips/); nothing is deployed.
name: kids-voices
on:
  push:
    branches: [kids-test]
    paths: ['voices/**']
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate voices
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
        run: python3 voices/make.py
      - name: Upload the audio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kids-voices
          path: voices/out/
          retention-days: 7
      - name: Copy the clips to the kids-voices-out branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub/clips" && cp voices/out/*.webm "$RUNNER_TEMP/pub/clips/"
          cd "$RUNNER_TEMP/pub"
          git init -q && git checkout -q -b kids-voices-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$GITHUB_RUN_ID" > run-id.txt
          git add clips run-id.txt && git commit -qm "Voice clips from run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kids-voices-out
